version: "3.8"

services:
  pocketbase:
    # Pin to a reviewed release before production; do not deploy :latest blindly.
    image: ghcr.io/muchobien/pocketbase:0.28.4
    restart: unless-stopped
    volumes:
      - /opt/bargain-hunt/pb_data:/pb_data
    expose:
      - "8090"
    networks: [bargain_hunt_internal]
    # No `ports`: PocketBase and its Dashboard are unreachable from the LAN/WAN.

  astro-app:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - /opt/bargain-hunt/astro-build:/app:ro
    environment:
      NODE_ENV: production
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_SUPERUSER_EMAIL: ${POCKETBASE_SUPERUSER_EMAIL}
      POCKETBASE_SUPERUSER_PASSWORD: ${POCKETBASE_SUPERUSER_PASSWORD}
      SITE_EDITOR_USERNAME: ${SITE_EDITOR_USERNAME:-editor}
      SITE_EDITOR_PASSWORD: ${SITE_EDITOR_PASSWORD}
    ports:
      - "4321:4321"
    command: sh -c "node ./dist/server/entry.mjs"
    depends_on:
      - pocketbase
    networks: [bargain_hunt_internal]

networks:
  bargain_hunt_internal:
    driver: bridge
